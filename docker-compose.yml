# Postgres + Backend + Frontend (선택)
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: back.dev.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    # depends_on:
    #   - postgres
  frontend:
    build:
      context: ./frontend
      dockerfile: front.dev.Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    # depends_on:
    #   - backend

volumes:
  postgres_data: